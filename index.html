<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="polyFly: a playable low-poly phoenix free-flight prototype." />
    <meta name="polyfly-base-path" content="./" />
    <title>polyFly</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #091528;
        color: #fff7df;
        font-variant-numeric: tabular-nums;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
      }

      .polyfly-shell {
        position: relative;
        width: 100%;
        height: 100%;
        background: linear-gradient(180deg, #61c7ff 0%, #f7bd5d 72%, #293b45 100%);
      }

      [hidden] {
        display: none !important;
      }

      .polyfly-ui {
        position: absolute;
        left: clamp(0.75rem, 2vw, 1.4rem);
        bottom: clamp(0.75rem, 2vw, 1.4rem);
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 0.55rem;
        width: max-content;
        max-width: calc(100vw - 1.5rem);
        padding: 0.5rem;
        border: 1px solid rgb(255 255 255 / 18%);
        border-radius: 0.82rem;
        background: rgb(24 42 35 / 45%);
        box-shadow: 0 0.75rem 2rem rgb(0 0 0 / 16%);
        backdrop-filter: blur(0.6rem);
        pointer-events: auto;
      }

      .polyfly-ui button,
      .polyfly-ui select {
        border: 1px solid rgb(255 255 255 / 22%);
        border-radius: 0.55rem;
        background: rgb(255 247 223 / 18%);
        color: #fff7df;
        font: inherit;
      }

      .polyfly-ui button {
        min-width: 4.8rem;
        padding: 0.4rem 0.58rem;
        cursor: pointer;
      }

      .polyfly-ui label {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        color: #ffe9bb;
        font-size: 0.78rem;
        white-space: nowrap;
      }

      .polyfly-ui select {
        max-width: 7.5rem;
        padding: 0.36rem 0.42rem;
      }

      .is-paused .polyfly-ui {
        background: rgb(45 33 31 / 45%);
      }

      canvas,
      .polyfly-canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: crosshair;
      }
    </style>
  </head>
  <body>
    <main id="app" class="polyfly-shell" aria-label="polyFly game viewport">
      <noscript>polyFly needs JavaScript enabled to render the Three.js scene.</noscript>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
