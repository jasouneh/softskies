<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Soft Skies is a relaxing low-poly flight sim about drifting through bright open skies." />
    <meta name="softskies-base-path" content="./" />
    <title>Soft Skies</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #091528;
        color: #fff7df;
        font-variant-numeric: tabular-nums;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
      }

      .softskies-shell {
        position: relative;
        width: 100%;
        height: 100%;
        background: linear-gradient(180deg, #61c7ff 0%, #f7bd5d 72%, #293b45 100%);
      }

      [hidden] {
        display: none !important;
      }

      .softskies-ui {
        position: absolute;
        left: clamp(0.65rem, 1.6vw, 1.15rem);
        bottom: clamp(0.65rem, 1.6vw, 1.15rem);
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 0.35rem;
        width: max-content;
        max-width: calc(100vw - 1.3rem);
        padding: 0.28rem;
        border: 1px solid rgb(255 255 255 / 12%);
        border-radius: 0.62rem;
        background: rgb(24 42 35 / 28%);
        box-shadow: 0 0.55rem 1.35rem rgb(0 0 0 / 10%);
        backdrop-filter: blur(0.45rem);
        font-size: 0.76rem;
        line-height: 1;
        pointer-events: auto;
      }

      .softskies-ui button {
        border: 1px solid rgb(255 255 255 / 18%);
        border-radius: 0.44rem;
        background: rgb(255 247 223 / 13%);
        color: #fff7df;
        font: inherit;
      }

      .softskies-ui button:focus-visible {
        outline: 2px solid rgb(255 218 125 / 70%);
        outline-offset: 2px;
      }

      .softskies-ui-button {
        height: 1.65rem;
        padding: 0 0.52rem;
        cursor: pointer;
        white-space: nowrap;
      }

      .softskies-pause-button {
        flex: 0 0 4.25rem;
        width: 4.25rem;
        text-align: center;
      }

      .softskies-avatar-picker {
        position: relative;
        display: flex;
      }

      .softskies-avatar-trigger {
        min-width: 4.25rem;
      }

      .softskies-avatar-menu {
        position: absolute;
        left: 0;
        bottom: calc(100% + 0.35rem);
        display: grid;
        gap: 0.32rem;
        min-width: 8.2rem;
        padding: 0.36rem;
        border: 1px solid rgb(255 255 255 / 16%);
        border-radius: 0.64rem;
        background: rgb(21 34 32 / 58%);
        box-shadow: 0 0.65rem 1.4rem rgb(0 0 0 / 16%);
        backdrop-filter: blur(0.55rem);
      }

      .softskies-avatar-option {
        display: grid;
        grid-template-columns: 2.4rem 1fr;
        align-items: center;
        gap: 0.42rem;
        width: 100%;
        padding: 0.3rem 0.38rem;
        text-align: left;
        cursor: pointer;
      }

      .softskies-avatar-option.is-selected {
        border-color: rgb(255 224 141 / 45%);
        background: rgb(255 206 103 / 18%);
      }

      .softskies-avatar-thumb {
        width: 2.4rem;
        height: 1.8rem;
        border-radius: 0.34rem;
        background: rgb(12 27 35 / 45%);
        box-shadow: inset 0 0 0 1px rgb(255 255 255 / 12%);
        object-fit: cover;
      }

      .softskies-map-trigger {
        display: inline-grid;
        place-items: center;
        width: 2rem;
        padding: 0;
      }

      .softskies-map-icon {
        width: 1.05rem;
        height: 1.05rem;
        filter: drop-shadow(0 0 0.28rem rgb(255 224 141 / 18%));
      }

      .softskies-map-backdrop {
        position: fixed;
        inset: 0;
        z-index: 4;
        display: grid;
        place-items: center;
        padding: 1.25rem;
        pointer-events: none;
      }

      .softskies-map-panel {
        width: min(28rem, calc(100vw - 2rem));
        padding: 0.85rem;
        border: 1px solid rgb(255 255 255 / 16%);
        border-radius: 0.9rem;
        background: rgb(12 24 34 / 82%);
        box-shadow: 0 1.1rem 2.6rem rgb(0 0 0 / 35%);
        backdrop-filter: blur(0.65rem);
        pointer-events: auto;
        animation: softskies-map-card-in 0.7s cubic-bezier(0.19, 1, 0.22, 1) both;
      }

      @keyframes softskies-map-card-in {
        from {
          opacity: 0;
          transform: translateY(0.55rem) scale(0.985);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .softskies-map-panel {
          animation-duration: 0.01ms;
        }
      }

      .softskies-map-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 0.68rem;
      }

      .softskies-map-title {
        margin: 0;
        font-size: 1rem;
      }

      .softskies-map-options {
        display: grid;
        gap: 0.5rem;
      }

      .softskies-map-option {
        width: 100%;
        padding: 0.64rem;
        text-align: left;
        cursor: pointer;
      }

      .softskies-map-option.is-selected {
        border-color: rgb(255 224 141 / 52%);
        background: rgb(255 206 103 / 18%);
      }

      .softskies-map-option-title {
        display: block;
        margin-bottom: 0.24rem;
        font-weight: 700;
      }

      .softskies-map-option-description {
        display: block;
        color: rgb(255 247 223 / 78%);
        line-height: 1.25;
      }

      .is-paused .softskies-ui {
        background: rgb(45 33 31 / 30%);
      }

      canvas,
      .softskies-canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: crosshair;
      }
    </style>
  </head>
  <body>
    <main id="app" class="softskies-shell" aria-label="Soft Skies game viewport">
      <noscript>Soft Skies needs JavaScript enabled to render the Three.js scene.</noscript>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
