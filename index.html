<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="polyFly: a playable low-poly phoenix free-flight prototype." />
    <meta name="polyfly-base-path" content="./" />
    <title>polyFly</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #091528;
        color: #fff7df;
        font-variant-numeric: tabular-nums;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
      }

      .polyfly-shell {
        position: relative;
        width: 100%;
        height: 100%;
        background: linear-gradient(180deg, #61c7ff 0%, #f7bd5d 72%, #293b45 100%);
      }

      .polyfly-overlay {
        position: absolute;
        left: clamp(1rem, 3vw, 2.5rem);
        top: clamp(1rem, 3vw, 2rem);
        max-width: min(32rem, calc(100vw - 2rem));
        padding: 1rem 1.15rem;
        border: 1px solid rgb(255 255 255 / 24%);
        border-radius: 1rem;
        background: rgb(9 21 40 / 68%);
        box-shadow: 0 1.5rem 4rem rgb(0 0 0 / 24%);
        backdrop-filter: blur(0.75rem);
        pointer-events: none;
      }

      .polyfly-overlay h1 {
        margin: 0 0 0.35rem;
        font-size: clamp(1.35rem, 4vw, 2.25rem);
        letter-spacing: 0.02em;
      }

      .polyfly-overlay p {
        margin: 0;
        color: #ffe9bb;
        line-height: 1.45;
      }

      .polyfly-stats {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.4rem 0.75rem;
        margin: 0.8rem 0;
      }

      .polyfly-stats div {
        padding: 0.42rem 0.5rem;
        border: 1px solid rgb(255 255 255 / 14%);
        border-radius: 0.65rem;
        background: rgb(255 255 255 / 9%);
      }

      .polyfly-stats dt {
        font-size: 0.68rem;
        color: #bdeaff;
        text-transform: uppercase;
        letter-spacing: 0.09em;
      }

      .polyfly-stats dd {
        margin: 0.12rem 0 0;
        color: #fff7df;
        font-weight: 700;
      }

      .polyfly-lock {
        font-size: 0.86rem;
      }

      .is-pointer-locked .polyfly-overlay {
        opacity: 0.58;
      }

      canvas,
      .polyfly-canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: crosshair;
      }
    </style>
  </head>
  <body>
    <main id="app" class="polyfly-shell" aria-label="polyFly game viewport">
      <noscript>polyFly needs JavaScript enabled to render the Three.js scene.</noscript>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
