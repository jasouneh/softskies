<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="polyFly: a playable low-poly phoenix free-flight prototype." />
    <meta name="polyfly-base-path" content="./" />
    <title>polyFly</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #091528;
        color: #fff7df;
        font-variant-numeric: tabular-nums;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
      }

      .polyfly-shell {
        position: relative;
        width: 100%;
        height: 100%;
        background: linear-gradient(180deg, #61c7ff 0%, #f7bd5d 72%, #293b45 100%);
      }

      [hidden] {
        display: none !important;
      }

      .polyfly-ui {
        position: absolute;
        left: clamp(0.75rem, 2vw, 1.4rem);
        bottom: clamp(0.75rem, 2vw, 1.4rem);
        z-index: 2;
        width: min(20rem, calc(100vw - 1.5rem));
        padding: 0.72rem;
        border: 1px solid rgb(255 255 255 / 20%);
        border-radius: 0.95rem;
        background: rgb(24 42 35 / 62%);
        box-shadow: 0 1rem 2.75rem rgb(0 0 0 / 20%);
        backdrop-filter: blur(0.65rem);
        pointer-events: auto;
      }

      .polyfly-ui__status,
      .polyfly-ui__actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.55rem;
      }

      .polyfly-ui__status {
        margin-bottom: 0.5rem;
        color: #fff7df;
        font-size: 0.88rem;
      }

      .polyfly-ui__status span {
        color: #cceec0;
      }

      .polyfly-ui__actions button,
      .polyfly-ui__actions select {
        border: 1px solid rgb(255 255 255 / 24%);
        border-radius: 0.55rem;
        background: rgb(255 247 223 / 16%);
        color: #fff7df;
        font: inherit;
      }

      .polyfly-ui__actions button {
        padding: 0.4rem 0.58rem;
        cursor: pointer;
      }

      .polyfly-ui__actions label {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        color: #ffe9bb;
        font-size: 0.78rem;
      }

      .polyfly-ui__actions select {
        max-width: 7.5rem;
        padding: 0.36rem 0.42rem;
      }

      .polyfly-stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 0.32rem;
        margin: 0.55rem 0 0.4rem;
      }

      .polyfly-stats div {
        padding: 0.35rem 0.38rem;
        border: 1px solid rgb(255 255 255 / 12%);
        border-radius: 0.5rem;
        background: rgb(255 255 255 / 8%);
      }

      .polyfly-stats dt {
        font-size: 0.58rem;
        color: #bdeaff;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .polyfly-stats dd {
        overflow: hidden;
        margin: 0.08rem 0 0;
        color: #fff7df;
        font-size: 0.72rem;
        font-weight: 700;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .polyfly-hint {
        margin: 0;
        color: #ffe9bb;
        font-size: 0.76rem;
      }

      .is-pointer-locked .polyfly-ui {
        opacity: 0.7;
      }

      .is-paused .polyfly-ui {
        background: rgb(45 33 31 / 72%);
      }

      canvas,
      .polyfly-canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: crosshair;
      }
    </style>
  </head>
  <body>
    <main id="app" class="polyfly-shell" aria-label="polyFly game viewport">
      <noscript>polyFly needs JavaScript enabled to render the Three.js scene.</noscript>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
